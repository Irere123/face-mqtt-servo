<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.R.A. System Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f14;
            --surface: #151a21;
            --surface-strong: #1d2430;
            --border: #303946;
            --border-soft: rgba(255, 255, 255, 0.08);
            --accent: #3dd6ff;
            --danger: #ff4d6d;
            --success: #35d07f;
            --warning: #ffb020;
            --text: #f0f3f6;
            --muted: #8b949e;
            --shadow: 0 18px 44px rgba(0, 0, 0, 0.36);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: var(--bg);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 104px 0 32px;
            overflow-x: hidden;
            background:
                linear-gradient(180deg, rgba(61, 214, 255, 0.06), rgba(11, 15, 20, 0) 320px),
                var(--bg);
            color: var(--text);
            font-family: "Roboto", Arial, sans-serif;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            padding: 16px 24px 14px;
            border-bottom: 1px solid var(--border-soft);
            background: rgba(13, 18, 25, 0.94);
            backdrop-filter: blur(14px);
            text-align: center;
        }

        h1,
        h2 {
            font-family: "Orbitron", Arial, sans-serif;
            letter-spacing: 0;
        }

        h1 {
            margin: 0;
            color: var(--accent);
            font-size: 1.75rem;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.84rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
        }

        .card {
            min-width: 0;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)), var(--surface);
            box-shadow: var(--shadow);
            padding: 24px;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.25;
            text-transform: uppercase;
        }

        .value {
            min-height: 3.1rem;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1.05;
            overflow-wrap: anywhere;
        }

        .movement-card {
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .movement-card.is-updating {
            border-color: rgba(61, 214, 255, 0.75);
            box-shadow: 0 0 0 1px rgba(61, 214, 255, 0.18), var(--shadow);
        }

        .movement-value.motion-left {
            color: var(--danger);
        }

        .movement-value.motion-right {
            color: var(--accent);
        }

        .movement-value.motion-centered {
            color: var(--success);
        }

        .movement-value.motion-searching {
            color: var(--warning);
        }

        .movement-value.motion-unknown {
            color: var(--muted);
        }

        .meta-line {
            min-height: 1.4rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .target-line {
            margin-top: 12px;
            color: #c3ccd6;
            font-size: 1.05rem;
        }

        .confidence-line {
            margin-top: 8px;
            font-size: 0.92rem;
        }

        .status-badge {
            display: inline-flex;
            min-height: 2rem;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 13px;
            background: var(--surface-strong);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-badge.connected,
        .status-badge.locked {
            border-color: rgba(53, 208, 127, 0.8);
            background: rgba(53, 208, 127, 0.14);
            color: var(--success);
        }

        .status-badge.connecting,
        .status-badge.reconnecting,
        .status-badge.searching {
            border-color: rgba(255, 176, 32, 0.85);
            background: rgba(255, 176, 32, 0.14);
            color: var(--warning);
        }

        .status-badge.disconnected,
        .status-badge.offline,
        .status-badge.error {
            border-color: rgba(255, 77, 109, 0.82);
            background: rgba(255, 77, 109, 0.13);
            color: var(--danger);
        }

        .face-frame {
            position: relative;
            width: 100%;
            min-height: 240px;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0e131a;
        }

        #face-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .face-frame.has-face #face-image {
            opacity: 1;
        }

        .face-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            color: var(--muted);
            font-size: 0.98rem;
            text-align: center;
        }

        .face-frame.has-face .face-placeholder {
            display: none;
        }

        #timestamp {
            min-height: 2.4rem;
            color: #cbd5df;
            font-size: 1.55rem;
        }

        #log-panel {
            grid-column: 1 / -1;
            text-align: left;
        }

        .log-list {
            height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.16);
            padding: 10px 12px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.86rem;
            line-height: 1.45;
            color: #b7c0cb;
        }

        .log-entry {
            display: grid;
            grid-template-columns: 88px minmax(0, 1fr);
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-entry:last-child {
            border-bottom: 0;
        }

        .log-time {
            color: var(--muted);
            white-space: nowrap;
        }

        .log-message {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 640px) {
            body {
                padding-top: 96px;
            }

            header {
                padding: 14px 16px 12px;
            }

            h1 {
                font-size: 1.35rem;
            }

            .container {
                grid-template-columns: 1fr;
                width: min(100% - 24px, 1200px);
                gap: 14px;
            }

            .card {
                padding: 18px;
            }

            .value {
                font-size: 1.8rem;
            }

            .face-frame {
                min-height: 210px;
            }

            .log-entry {
                grid-template-columns: 78px minmax(0, 1fr);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>S.A.R.A. Vision Control</h1>
        <div class="subtitle">Distributed Actuation System - Team 313</div>
    </header>

    <main class="container" aria-label="Vision control dashboard">
        <section class="card" aria-labelledby="face-heading">
            <h2 id="face-heading">Face Picture</h2>
            <div id="face-frame" class="face-frame" aria-live="polite">
                <img id="face-image" src="" alt="Locked face crop">
                <div id="no-face-msg" class="face-placeholder">Waiting for face...</div>
            </div>
        </section>

        <section id="movement-card" class="card movement-card" aria-labelledby="tracking-heading">
            <h2 id="tracking-heading">Tracking Status</h2>
            <div id="movement-status" class="value movement-value motion-unknown" aria-live="polite">WAITING...</div>
            <div id="target-info" class="meta-line target-line">Target: --</div>
            <div id="lock-status" class="status-badge searching">Searching</div>
            <div id="confidence" class="meta-line confidence-line">Confidence: --</div>
        </section>

        <section class="card" aria-labelledby="system-heading">
            <h2 id="system-heading">System Connection</h2>
            <div id="connection-status" class="status-badge disconnected" aria-live="polite">Disconnected</div>
            <div id="timestamp" class="value">--:--:--</div>
            <div id="stream-age" class="meta-line">Stream: waiting</div>
        </section>

        <section class="card" id="log-panel" aria-labelledby="log-heading">
            <h2 id="log-heading">Event Log</h2>
            <div id="logs" class="log-list" aria-live="polite" aria-relevant="additions"></div>
        </section>
    </main>

    <script>
        (() => {
            'use strict';

            const CONFIG = Object.freeze({
                websocketPort: 9002,
                reconnectBaseMs: 750,
                reconnectMaxMs: 10000,
                streamStaleMs: 8000,
                maxLogs: 120,
                maxMessageLength: 2200000,
                maxImageLength: 1800000,
                flashMs: 180,
            });

            const STATUS_META = Object.freeze({
                MOVE_LEFT: { label: 'MOVE LEFT', className: 'motion-left' },
                MOVE_RIGHT: { label: 'MOVE RIGHT', className: 'motion-right' },
                CENTERED: { label: 'CENTERED', className: 'motion-centered' },
                NO_FACE: { label: 'NO FACE', className: 'motion-searching' },
                WAITING: { label: 'WAITING...', className: 'motion-unknown' },
                UNKNOWN: { label: 'UNKNOWN', className: 'motion-unknown' },
            });

            const CONNECTION_LABELS = Object.freeze({
                connecting: 'Connecting',
                connected: 'Connected',
                reconnecting: 'Reconnecting',
                disconnected: 'Disconnected',
                offline: 'Offline',
                error: 'Error',
            });

            const els = Object.freeze({
                movementCard: byId('movement-card'),
                movementStatus: byId('movement-status'),
                connectionStatus: byId('connection-status'),
                timestamp: byId('timestamp'),
                streamAge: byId('stream-age'),
                confidence: byId('confidence'),
                targetInfo: byId('target-info'),
                lockStatus: byId('lock-status'),
                faceFrame: byId('face-frame'),
                faceImage: byId('face-image'),
                logs: byId('logs'),
            });

            const state = {
                connection: 'disconnected',
                lastMessageAt: 0,
                movement: {
                    status: 'WAITING',
                    target: null,
                    locked: false,
                    confidence: null,
                    timestamp: null,
                },
                face: {
                    src: '',
                    signature: '',
                    visible: false,
                },
                nodeStatus: new Map(),
                logs: [],
                logVersion: 0,
                flashVersion: 0,
            };

            const rendered = {
                logVersion: -1,
                faceSrc: '',
                faceVisible: null,
                flashVersion: -1,
            };

            let ws = null;
            let reconnectTimerId = 0;
            let reconnectAttempt = 0;
            let renderQueued = false;
            let movementFlashTimerId = 0;

            const wsUrl = buildWebSocketUrl();

            connect();
            setInterval(queueRender, 1000);

            window.addEventListener('online', () => {
                addLog('Network online. Reconnecting now.');
                reconnectAttempt = 0;
                connect();
            });

            window.addEventListener('offline', () => {
                setConnection('offline');
                addLog('Network offline.');
            });

            window.addEventListener('beforeunload', () => {
                clearTimeout(reconnectTimerId);
                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                    ws.close(1000, 'Page closed');
                }
            });

            function byId(id) {
                const el = document.getElementById(id);
                if (!el) {
                    throw new Error(`Missing dashboard element: ${id}`);
                }
                return el;
            }

            function buildWebSocketUrl() {
                const host = location.hostname || 'localhost';
                const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
                return `${protocol}://${host}:${CONFIG.websocketPort}`;
            }

            function connect() {
                clearTimeout(reconnectTimerId);

                if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                    return;
                }

                setConnection(navigator.onLine === false ? 'offline' : 'connecting');

                try {
                    ws = new WebSocket(wsUrl);
                } catch (error) {
                    scheduleReconnect('WebSocket could not start.');
                    return;
                }

                const socket = ws;

                socket.addEventListener('open', () => {
                    if (socket !== ws) {
                        return;
                    }

                    reconnectAttempt = 0;
                    setConnection('connected');
                    addLog('System connected to backend.');
                });

                socket.addEventListener('close', (event) => {
                    if (socket !== ws) {
                        return;
                    }

                    setConnection('disconnected');
                    scheduleReconnect(event.reason ? `Connection closed: ${event.reason}` : 'Connection lost.');
                });

                socket.addEventListener('error', () => {
                    if (socket !== ws) {
                        return;
                    }

                    setConnection('error');
                });

                socket.addEventListener('message', handleRawMessage);
            }

            function scheduleReconnect(reason) {
                clearTimeout(reconnectTimerId);

                if (reason) {
                    addLog(`${reason} Reconnecting...`);
                }

                if (navigator.onLine === false) {
                    setConnection('offline');
                    return;
                }

                setConnection('reconnecting');
                const backoff = Math.min(CONFIG.reconnectMaxMs, CONFIG.reconnectBaseMs * (2 ** reconnectAttempt));
                const jitter = Math.floor(Math.random() * 300);
                reconnectAttempt += 1;
                reconnectTimerId = setTimeout(connect, backoff + jitter);
            }

            function handleRawMessage(event) {
                const raw = typeof event.data === 'string' ? event.data : '';
                if (!raw || raw.length > CONFIG.maxMessageLength) {
                    addLog('Dropped oversized or empty backend message.');
                    return;
                }

                let data;
                try {
                    data = JSON.parse(raw);
                } catch (error) {
                    addLog('Dropped non-JSON backend message.');
                    return;
                }

                if (!isPlainObject(data)) {
                    addLog('Dropped unsupported backend message.');
                    return;
                }

                state.lastMessageAt = Date.now();

                if (data.type === 'STATUS') {
                    addLog(safeText(data.message, 'Backend status update.'));
                    queueRender();
                    return;
                }

                if (data.node) {
                    handleHeartbeat(data);
                    return;
                }

                const movement = normalizeMovement(data);
                if (!movement) {
                    addLog('Dropped message without tracking data.');
                    queueRender();
                    return;
                }

                applyMovement(movement);
            }

            function handleHeartbeat(data) {
                const nodeName = safeText(data.node, 'unknown_node');
                const nodeState = safeText(data.status, 'UNKNOWN').toUpperCase();
                const previous = state.nodeStatus.get(nodeName);

                state.nodeStatus.set(nodeName, {
                    status: nodeState,
                    timestamp: normalizeTimestamp(data.timestamp) || new Date(),
                });

                if (!previous || previous.status !== nodeState) {
                    addLog(`Heartbeat: ${nodeName} is ${nodeState}`);
                }

                queueRender();
            }

            function normalizeMovement(data) {
                if (!Object.prototype.hasOwnProperty.call(data, 'status')) {
                    return null;
                }

                const rawStatus = safeText(data.status, 'UNKNOWN').toUpperCase();
                const status = Object.prototype.hasOwnProperty.call(STATUS_META, rawStatus) ? rawStatus : 'UNKNOWN';
                const locked = normalizeBoolean(data.locked);
                const confidence = normalizeConfidence(data.confidence);
                const timestamp = normalizeTimestamp(data.timestamp) || new Date();
                const target = safeOptionalText(data.target);
                const image = sanitizeImage(data.face_image);

                return { status, locked, confidence, timestamp, target, image };
            }

            function applyMovement(next) {
                const previous = state.movement;
                const statusChanged = previous.status !== next.status || previous.locked !== next.locked;
                const nextTarget = next.target || previous.target;

                state.movement = {
                    status: next.status,
                    locked: next.locked,
                    confidence: next.confidence,
                    timestamp: next.timestamp,
                    target: nextTarget,
                };

                if (next.image) {
                    state.face.src = `data:image/jpeg;base64,${next.image.value}`;
                    state.face.signature = next.image.signature;
                    state.face.visible = true;
                } else if (!next.locked) {
                    state.face.visible = false;
                    state.face.src = '';
                    state.face.signature = '';
                }

                if (statusChanged) {
                    state.flashVersion += 1;
                    addLog(`Tracking ${STATUS_META[next.status].label}; lock ${next.locked ? 'LOCKED' : 'SEARCHING'}.`);
                } else {
                    queueRender();
                }
            }

            function render() {
                renderQueued = false;
                renderConnection();
                renderMovement();
                renderFace();
                renderLogs();
            }

            function renderConnection() {
                const label = CONNECTION_LABELS[state.connection] || CONNECTION_LABELS.disconnected;
                setText(els.connectionStatus, label);
                setClassName(els.connectionStatus, `status-badge ${state.connection}`);

                const age = state.lastMessageAt ? Date.now() - state.lastMessageAt : null;
                const streamText = age === null
                    ? 'Stream: waiting'
                    : `Stream: ${age > CONFIG.streamStaleMs ? 'stale' : 'live'} (${formatAge(age)})`;
                setText(els.streamAge, streamText);
            }

            function renderMovement() {
                const movement = state.movement;
                const meta = STATUS_META[movement.status] || STATUS_META.UNKNOWN;

                setText(els.movementStatus, meta.label);
                setClassName(els.movementStatus, `value movement-value ${meta.className}`);
                setText(els.targetInfo, `Target: ${movement.target || '--'}`);
                setText(els.confidence, `Confidence: ${formatConfidence(movement.confidence)}`);
                setText(els.timestamp, movement.timestamp ? formatTime(movement.timestamp) : '--:--:--');

                setText(els.lockStatus, movement.locked ? 'Locked' : 'Searching');
                setClassName(els.lockStatus, `status-badge ${movement.locked ? 'locked' : 'searching'}`);

                if (rendered.flashVersion !== state.flashVersion) {
                    rendered.flashVersion = state.flashVersion;
                    els.movementCard.classList.add('is-updating');
                    clearTimeout(movementFlashTimerId);
                    movementFlashTimerId = setTimeout(() => {
                        els.movementCard.classList.remove('is-updating');
                    }, CONFIG.flashMs);
                }
            }

            function renderFace() {
                if (rendered.faceSrc !== state.face.src) {
                    rendered.faceSrc = state.face.src;
                    els.faceImage.src = state.face.src;
                }

                if (rendered.faceVisible !== state.face.visible) {
                    rendered.faceVisible = state.face.visible;
                    els.faceFrame.classList.toggle('has-face', state.face.visible);
                }
            }

            function renderLogs() {
                if (rendered.logVersion === state.logVersion) {
                    return;
                }

                const fragment = document.createDocumentFragment();
                for (const entry of state.logs) {
                    const row = document.createElement('div');
                    const time = document.createElement('span');
                    const message = document.createElement('span');

                    row.className = 'log-entry';
                    time.className = 'log-time';
                    message.className = 'log-message';
                    time.textContent = formatTime(entry.time);
                    message.textContent = entry.message;

                    row.append(time, message);
                    fragment.appendChild(row);
                }

                els.logs.replaceChildren(fragment);
                rendered.logVersion = state.logVersion;
            }

            function addLog(message) {
                const cleaned = safeText(message, '').replace(/\s+/g, ' ').trim();
                if (!cleaned) {
                    return;
                }

                state.logs.unshift({
                    time: new Date(),
                    message: cleaned.slice(0, 220),
                });

                if (state.logs.length > CONFIG.maxLogs) {
                    state.logs.length = CONFIG.maxLogs;
                }

                state.logVersion += 1;
                queueRender();
            }

            function queueRender() {
                if (renderQueued) {
                    return;
                }

                renderQueued = true;
                requestAnimationFrame(render);
            }

            function setConnection(next) {
                if (state.connection === next) {
                    return;
                }

                state.connection = next;
                queueRender();
            }

            function setText(el, value) {
                if (el.textContent !== value) {
                    el.textContent = value;
                }
            }

            function setClassName(el, value) {
                if (el.className !== value) {
                    el.className = value;
                }
            }

            function isPlainObject(value) {
                return Boolean(value) && Object.prototype.toString.call(value) === '[object Object]';
            }

            function normalizeBoolean(value) {
                return value === true || value === 1 || value === '1' || value === 'true' || value === 'TRUE';
            }

            function normalizeConfidence(value) {
                const number = Number(value);
                if (!Number.isFinite(number)) {
                    return null;
                }

                return Math.min(1, Math.max(0, number));
            }

            function normalizeTimestamp(value) {
                const number = Number(value);
                if (!Number.isFinite(number) || number <= 0) {
                    return null;
                }

                const millis = number > 100000000000 ? number : number * 1000;
                const date = new Date(millis);
                return Number.isNaN(date.getTime()) ? null : date;
            }

            function sanitizeImage(value) {
                if (typeof value !== 'string' || value.length === 0) {
                    return null;
                }

                if (value.length > CONFIG.maxImageLength || !/^[A-Za-z0-9+/=]+$/.test(value)) {
                    addLog('Dropped invalid face snapshot.');
                    return null;
                }

                return {
                    value,
                    signature: `${value.length}:${value.slice(0, 16)}:${value.slice(-16)}`,
                };
            }

            function safeText(value, fallback) {
                if (typeof value === 'string') {
                    const trimmed = value.trim();
                    return trimmed || fallback;
                }

                if (typeof value === 'number' || typeof value === 'boolean') {
                    return String(value);
                }

                return fallback;
            }

            function safeOptionalText(value) {
                const text = safeText(value, '');
                return text ? text.slice(0, 80) : null;
            }

            function formatConfidence(value) {
                return typeof value === 'number' ? `${(value * 100).toFixed(1)}%` : '--';
            }

            function formatTime(value) {
                return value instanceof Date && !Number.isNaN(value.getTime())
                    ? value.toLocaleTimeString()
                    : '--:--:--';
            }

            function formatAge(ms) {
                if (ms < 1000) {
                    return 'now';
                }

                const seconds = Math.round(ms / 1000);
                return `${seconds}s ago`;
            }
        })();
    </script>
</body>

</html>
